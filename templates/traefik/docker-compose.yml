# WHARF-managed Traefik — deployed by bootstrap to
# /opt/wharf/traefik/docker-compose.yml and run as compose project
# `wharf-traefik`. Do not edit on the server; re-running bootstrap
# re-uploads this file (architecture §4.1 step 3).
services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./acme.json:/acme.json
    environment:
      # Some hosts' docker.sock (rootless setups, certain panel-managed
      # sockets, restricted socket proxies) fail the Docker SDK's version
      # auto-negotiation and the client falls back to an ancient hardcoded
      # default (API 1.24 — Docker Engine ~2016). Modern daemons refuse that
      # outright: "client version 1.24 is too old. Minimum supported API
      # version is 1.40" — and Traefik's docker provider then never
      # discovers ANY container's labels, silently, retrying forever. Fixing
      # it at the source (this env var) rather than requiring every host to
      # have perfectly behaved auto-negotiation. 1.41 (Docker Engine 20.10,
      # released 2020) comfortably satisfies "minimum 1.40" on virtually any
      # daemon in current use.
      - DOCKER_API_VERSION=1.41
    networks:
      - traefik

networks:
  traefik:
    external: true
