# WHARF-managed Traefik — deployed by bootstrap to
# /opt/wharf/traefik/docker-compose.yml and run as compose project
# `wharf-traefik`. Do not edit on the server; re-running bootstrap
# re-uploads this file (architecture §4.1 step 3).
services:
  traefik:
    # Pinned well past v3.6.1 on purpose — Traefik's docker provider had a
    # confirmed bug through v3.1-v3.5 where its Docker API client hardcoded
    # version 1.24 as its negotiation baseline and did NOT reliably respect
    # an explicit DOCKER_API_VERSION override either (verified against a real
    # host: setting that env var had zero effect, even after a full
    # container recreation — same "client version 1.24 is too old. Minimum
    # supported API version is 1.40" error from the daemon, word for word).
    # Modern Docker Engine releases (29.x+) dropped support for API 1.24
    # entirely, so on such a host Traefik's docker provider never discovers
    # ANY container's labels — silently, retrying forever, no visible error
    # anywhere except its own logs. Traefik v3.6.1 fixed this properly:
    # the provider now queries the daemon for its real supported version
    # range and negotiates the highest mutually compatible version
    # automatically — no env var workaround needed or wanted.
    # (github.com/traefik/traefik issue #12253; community.traefik.io threads
    # on "Traefik stops working, it uses old API version 1.24" and "Traefik
    # Docker provider always tries API v1.24 despite Docker API 1.53".)
    image: traefik:v3.7.9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./acme.json:/acme.json
    networks:
      - traefik

networks:
  traefik:
    external: true
