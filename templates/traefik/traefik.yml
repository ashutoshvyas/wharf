# WHARF Traefik static config — rendered by lib/bootstrap
# ({{LE_EMAIL}} substituted from LETSENCRYPT_EMAIL) and uploaded to
# /opt/wharf/traefik/traefik.yml. Enables the two-subdomain design
# (architecture §1): label-driven Docker provider for instance routers,
# file provider for the wharf-auth middleware, HTTP→HTTPS redirect, and
# on-demand Let's Encrypt HTTP-01 certificates.
providers:
  docker:
    exposedByDefault: false
    network: traefik
  file:
    directory: /etc/traefik/dynamic

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{LE_EMAIL}}"
      storage: /acme.json
      httpChallenge:
        entryPoint: web
